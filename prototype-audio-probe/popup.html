<!doctype html>
<meta charset="utf-8" />
<title>音频探针</title>
<style>
  body {
    width: 740px;
    margin: 0;
    padding: 16px;
    font: 13px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #1a1a1a;
    background: #fbfbfa;
  }
  h1 { font-size: 15px; margin: 0 0 4px; }
  .sub { color: #6b6b6b; font-size: 12px; margin: 0 0 14px; }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  button {
    padding: 7px 16px; font-size: 13px; font-weight: 600;
    border: 0; border-radius: 6px; background: #1a1a1a; color: #fff; cursor: pointer;
  }
  button:disabled { background: #c4c4c4; cursor: default; }
  input[type=password] {
    flex: 1; padding: 6px 9px; font-size: 12px;
    border: 1px solid #d8d8d6; border-radius: 6px; background: #fff;
  }
  .hint { font-size: 11px; color: #8a8a8a; margin: -4px 0 12px; }
  #log {
    background: #fff; border: 1px solid #e6e6e3; border-radius: 8px;
    padding: 12px; max-height: 400px; overflow-y: auto;
    font: 12px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: pre-wrap; word-break: break-all;
  }
  .ok { color: #0a7d3f; }
  .bad { color: #c02626; }
  .warn { color: #a06a00; }
  .dim { color: #8a8a8a; }
  .head { font-weight: 700; display: block; margin: 10px 0 2px; }
  .head:first-child { margin-top: 0; }
</style>

<h1>音频探针</h1>
<p class="sub">
  第 2 版：换客户端身份获取直连地址。<br />
  用法：在任意 YouTube 视频页面点「开始验证」即可，<b>不需要先播放</b>。
</p>

<div class="row">
  <input id="key" type="password" placeholder="可选：粘贴 Groq API Key，会真的跑一次识别" autocomplete="off" />
</div>
<p class="hint">Key 只留在这个弹窗里，不保存、不上传到除 Groq 以外的任何地方。留空则跳过识别测试。</p>

<div class="row">
  <button id="run">开始验证</button>
</div>

<div id="log" class="dim">等待开始…</div>

<script src="popup.js"></script>
